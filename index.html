<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Calendario Laboral PLM</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>

<body>

<main>

<!-- RESUMEN -->
<section id="resumen" class="tab active">
  <div class="page-title">Calendario Laboral PLM</div>
  <div class="page-subtitle">Resumen general anual</div>

  <div class="card">
    <label>Año</label>
    <select id="summaryYear" onchange="changeSummaryYear(this.value)"></select>
  </div>

  <div class="grid" id="summaryGrid"></div>
</section>

<!-- CALENDARIO -->
<section id="calendario" class="tab">

  <div class="card">

    <div class="calendar-controls">

      <div>
        <label>Año</label>
        <select id="calendarYearSelect" onchange="jumpToYear(this.value)"></select>
      </div>

      <div>
        <label>Categoría activa</label>
        <select id="categorySelect" onchange="setSelectedCategory(this.value)"></select>
      </div>

    </div>

    <div class="view-switch">
      <button id="viewMonth" onclick="setCalendarView('month')">Mensual</button>
      <button id="viewWeek" onclick="setCalendarView('week')">Semanal</button>
      <button id="viewYear" onclick="setCalendarView('year')">Anual</button>
    </div>

    <div class="toolbar">
      <button class="secondary" onclick="changePeriod(-1)">‹</button>
      <div class="calendar-title" id="calendarTitle"></div>
      <button class="secondary" onclick="changePeriod(1)">›</button>
    </div>

    <div id="calendarContainer"></div>

  </div>
</section>

<!-- CONTADORES -->
<section id="contadores" class="tab">
  <div class="page-title">Contadores</div>

  <div class="card">
    <label>Año</label>
    <select id="counterYear" onchange="renderCounters()"></select>
  </div>

  <div class="card" id="counterInputs"></div>

  <button class="full" onclick="saveCounters()">Guardar contadores</button>
</section>

<!-- HISTÓRICO -->
<section id="historico" class="tab">
  <div class="page-title">Histórico</div>

  <div class="card">
    <div class="form-row">
      <label>Fecha</label>
      <input type="date" id="historyDate">
    </div>

    <div class="form-row">
      <label>Categoría</label>
      <select id="historyCategory"></select>
    </div>

    <div class="form-row">
      <label>Horas (si aplica)</label>
      <input type="number" step="0.25" id="historyHours">
    </div>

    <div class="form-row">
      <label>Observaciones</label>
      <textarea id="historyNote"></textarea>
    </div>

    <button class="full" onclick="saveHistory()">Guardar histórico</button>
  </div>

  <div class="card">
    <button class="secondary full" onclick="exportHistoryCSV()">Exportar histórico CSV</button>
  </div>

  <div class="card">
    <div id="historyList"></div>
  </div>
</section>

<!-- HORAS EXTRA -->
<section id="horas" class="tab">
  <div class="page-title">Horas extra</div>

  <div class="card">
    <div class="form-row">
      <label>Fecha</label>
      <input type="date" id="extraDate">
    </div>

    <div class="form-row">
      <label>Horas trabajadas</label>
      <input type="number" step="0.25" id="extraHours">
    </div>

    <div class="form-row">
      <label>Observaciones</label>
      <textarea id="extraNote"></textarea>
    </div>

    <button class="full" onclick="saveExtra()">Guardar horas</button>
  </div>

  <div class="card">
    <button class="secondary full" onclick="exportExtrasCSV()">Exportar horas CSV</button>
  </div>

  <div class="card">
    <div id="extraList"></div>
  </div>
</section>

<!-- AJUSTES -->
<section id="ajustes" class="tab">
  <div class="page-title">Personalización</div>

  <div class="card">
    <h3>Colores de categorías</h3>
    <div id="colorSettings"></div>
    <button class="full" onclick="saveColors()">Guardar colores</button>
  </div>

  <div class="card">
    <h3>Recordatorios locales</h3>
    <button class="secondary full" onclick="requestNotificationPermission()">Activar notificaciones</button>
  </div>

  <div class="card">
    <h3>Copia de seguridad</h3>
    <button class="secondary full" onclick="exportBackup()">Exportar copia JSON</button>
    <br><br>
    <input type="file" id="importBackupFile" accept=".json" onchange="importBackup(event)">
  </div>

  <div class="card">
    <h3>Exportación PDF</h3>
    <button class="secondary full" onclick="exportPDF()">Exportar PDF / Imprimir</button>
  </div>

  <div class="card">
    <h3>Seguridad</h3>
    <button class="danger full" onclick="resetApp()">Borrar todos los datos</button>
  </div>
</section>

</main>

<!-- NAV -->
<nav class="bottom-nav">
  <button class="nav-btn active" onclick="showTab('resumen',this)">
    <span>🏠</span>Inicio
  </button>

  <button class="nav-btn" onclick="showTab('calendario',this)">
    <span>📅</span>Calend.
  </button>

  <button class="nav-btn" onclick="showTab('contadores',this)">
    <span>📊</span>Cont.
  </button>

  <button class="nav-btn" onclick="showTab('historico',this)">
    <span>🗂️</span>Hist.
  </button>

  <button class="nav-btn" onclick="showTab('horas',this)">
    <span>⏱️</span>Horas
  </button>

  <button class="nav-btn" onclick="showTab('ajustes',this)">
    <span>⚙️</span>Ajustes
  </button>
</nav>

<!-- MODAL -->
<div id="editModal" class="modal-backdrop">
  <div class="modal">

    <h3 id="modalTitle">Editar día</h3>

    <div class="form-row">
      <label>Categoría</label>
      <select id="modalCategory" onchange="toggleModalHours()"></select>
    </div>

    <div class="form-row" id="modalHoursRow">
      <label>Horas gastadas</label>
      <input type="number" step="0.25" id="modalHours">
    </div>

    <div class="form-row">
      <label>Observaciones</label>
      <textarea id="modalNote"></textarea>
    </div>

    <div class="modal-actions">
      <button class="secondary" onclick="closeEditModal()">Cancelar</button>
      <button onclick="saveEditModal()">Guardar</button>
    </div>

  </div>
</div>

<script src="app.js?v=20"></script>

<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./service-worker.js");
}
</script>

</body>
</html>
