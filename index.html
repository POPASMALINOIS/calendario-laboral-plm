<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario Laboral PLM</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1f3a5f">
  <link rel="apple-touch-icon" href="icon-192.png">

  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #1f3a5f;
      --primary-soft: #e8eef8;
      --shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 80px;
    }

    header {
      padding: 18px 16px 10px;
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
    }

    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    main {
      padding: 12px;
    }

    .tab {
      display: none;
    }

    .tab.active {
      display: block;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .summary-card {
      min-height: 110px;
    }

    .summary-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
    }

    .summary-value {
      font-size: 24px;
      font-weight: 900;
      margin-top: 8px;
    }

    .summary-small {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
    }

    button, select, input, textarea {
      font-family: inherit;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 10px 12px;
      background: var(--primary);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button.secondary {
      background: var(--primary-soft);
      color: var(--primary);
    }

    button.danger {
      background: #fee2e2;
      color: #991b1b;
    }

    select, input, textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: white;
      font-size: 14px;
    }

    textarea {
      min-height: 74px;
      resize: vertical;
    }

    label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
      font-weight: 700;
    }

    .form-row {
      margin-bottom: 10px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      gap: 8px;
    }

    .calendar-title {
      flex: 1;
      text-align: center;
      font-size: 18px;
      font-weight: 900;
    }

    .weekdays, .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .weekday {
      text-align: center;
      font-size: 11px;
      font-weight: 800;
      color: var(--muted);
      padding: 4px 0;
    }

    .day {
      min-height: 72px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 5px;
      overflow: hidden;
    }

    .day.empty {
      opacity: 0;
      pointer-events: none;
    }

    .day-number {
      font-size: 12px;
      font-weight: 900;
    }

    .holiday {
      color: #dc2626;
    }

    .holiday-label {
      font-size: 8px;
      color: #dc2626;
      font-weight: 700;
    }

    .tag {
      display: inline-block;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 5px;
      border-radius: 999px;
      color: white;
      margin: 2px 2px 0 0;
    }

    .category-picker {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }

    .category-pill {
      flex: 0 0 auto;
      border-radius: 999px;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 800;
      color: white;
      border: 3px solid transparent;
    }

    .category-pill.selected {
      border-color: #111827;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      z-index: 100;
    }

    .nav-btn {
      background: transparent;
      color: var(--muted);
      border-radius: 0;
      padding: 7px 2px;
      font-size: 10px;
      font-weight: 800;
    }

    .nav-btn span {
      display: block;
      font-size: 18px;
      margin-bottom: 2px;
    }

    .nav-btn.active {
      color: var(--primary);
      background: var(--primary-soft);
    }

    .counter-row {
      display: grid;
      grid-template-columns: 1fr 90px;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }

    .color-row {
      display: grid;
      grid-template-columns: 1fr 70px;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
    }

    .list-item {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .list-item:last-child {
      border-bottom: none;
    }

    .small {
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 390px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .day {
        min-height: 62px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>Calendario Laboral PLM</h1>
  <p>Control de días, permisos y horas extra</p>
</header>

<main>

  <section id="resumen" class="tab active">
    <div class="grid" id="summaryGrid"></div>
  </section>

  <section id="calendario" class="tab">
    <div class="card">
      <label>Categoría activa</label>
      <div class="category-picker" id="categoryPicker"></div>
      <button class="secondary" onclick="clearSelectedCategory()">Modo borrar categoría</button>
    </div>

    <div class="card">
      <div class="toolbar">
        <button class="secondary" onclick="changeMonth(-1)">‹</button>
        <div class="calendar-title" id="calendarTitle"></div>
        <button class="secondary" onclick="changeMonth(1)">›</button>
      </div>

      <div class="weekdays">
        <div class="weekday">L</div>
        <div class="weekday">M</div>
        <div class="weekday">X</div>
        <div class="weekday">J</div>
        <div class="weekday">V</div>
        <div class="weekday">S</div>
        <div class="weekday">D</div>
      </div>

      <div class="calendar-grid" id="calendarGrid"></div>
    </div>
  </section>

  <section id="contadores" class="tab">
    <div class="card">
      <label>Año</label>
      <select id="counterYear"></select>
    </div>

    <div class="card" id="counterInputs"></div>

    <button onclick="saveCounters()">Guardar contadores</button>
  </section>

  <section id="historico" class="tab">
    <div class="card">
      <div class="form-row">
        <label>Fecha</label>
        <input type="date" id="historyDate">
      </div>

      <div class="form-row">
        <label>Categoría</label>
        <select id="historyCategory"></select>
      </div>

      <div class="form-row">
        <label>Observaciones</label>
        <textarea id="historyNote"></textarea>
      </div>

      <button onclick="saveHistory()">Guardar histórico</button>
    </div>

    <div class="card">
      <h3>Histórico</h3>
      <div id="historyList"></div>
    </div>
  </section>

  <section id="horas" class="tab">
    <div class="card">
      <div class="form-row">
        <label>Fecha</label>
        <input type="date" id="extraDate">
      </div>

      <div class="form-row">
        <label>Horas trabajadas</label>
        <input type="number" step="0.25" id="extraHours">
      </div>

      <div class="form-row">
        <label>Observaciones</label>
        <textarea id="extraNote"></textarea>
      </div>

      <button onclick="saveExtra()">Guardar horas</button>
    </div>

    <div class="card">
      <h3>Horas extra</h3>
      <div id="extraList"></div>
    </div>
  </section>

  <section id="ajustes" class="tab">
    <div class="card">
      <h3>Colores de categorías</h3>
      <div id="colorSettings"></div>
      <button onclick="saveColors()">Guardar colores</button>
    </div>

    <div class="card">
      <h3>Datos</h3>
      <button class="danger" onclick="resetApp()">Borrar todos los datos</button>
    </div>
  </section>

</main>

<nav class="bottom-nav">
  <button class="nav-btn active" onclick="showTab('resumen', this)">
    <span>🏠</span>Inicio
  </button>

  <button class="nav-btn" onclick="showTab('calendario', this)">
    <span>📅</span>Calend.
  </button>

  <button class="nav-btn" onclick="showTab('contadores', this)">
    <span>📊</span>Cont.
  </button>

  <button class="nav-btn" onclick="showTab('historico', this)">
    <span>🗂️</span>Hist.
  </button>

  <button class="nav-btn" onclick="showTab('horas', this)">
    <span>⏱️</span>Horas
  </button>

  <button class="nav-btn" onclick="showTab('ajustes', this)">
    <span>⚙️</span>Ajustes
  </button>
</nav>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js");
  }
</script>

</body>
</html>
