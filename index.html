<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Calendario Laboral PLM</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1f3a5f">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <h1>Calendario Laboral PLM</h1>
  <p>Control de días, permisos y horas extra</p>
</header>

<main>

  <section id="resumen" class="tab active">
    <div class="grid" id="summaryGrid"></div>
  </section>

  <section id="calendario" class="tab">
    <div class="card">
      <label>Categoría activa</label>
      <select id="categorySelect" onchange="setSelectedCategory(this.value)"></select>
      <button class="secondary full" onclick="clearSelectedCategory()">Modo borrar categoría</button>
    </div>

    <div class="card">
      <div class="view-switch">
        <button onclick="setCalendarView('month')" id="viewMonth">Mensual</button>
        <button onclick="setCalendarView('week')" id="viewWeek">Semanal</button>
        <button onclick="setCalendarView('year')" id="viewYear">Anual</button>
      </div>

      <div class="toolbar">
        <button class="secondary" onclick="changePeriod(-1)">‹</button>
        <div class="calendar-title" id="calendarTitle"></div>
        <button class="secondary" onclick="changePeriod(1)">›</button>
      </div>

      <div id="calendarContainer"></div>
    </div>
  </section>

  <section id="contadores" class="tab">
    <div class="card">
      <label>Año</label>
      <select id="counterYear" onchange="renderCounters()"></select>
    </div>

    <div class="card" id="counterInputs"></div>

    <button class="full" onclick="saveCounters()">Guardar contadores</button>
  </section>

  <section id="historico" class="tab">
    <div class="card">
      <div class="form-row">
        <label>Fecha</label>
        <input type="date" id="historyDate">
      </div>

      <div class="form-row">
        <label>Categoría</label>
        <select id="historyCategory"></select>
      </div>

      <div class="form-row">
        <label>Horas, solo acompañamientos</label>
        <input type="number" step="0.25" id="historyHours" placeholder="Ej. 2">
      </div>

      <div class="form-row">
        <label>Observaciones</label>
        <textarea id="historyNote"></textarea>
      </div>

      <button class="full" onclick="saveHistory()">Guardar histórico</button>
    </div>

    <div class="card">
      <h3>Histórico</h3>
      <div id="historyList"></div>
    </div>
  </section>

  <section id="horas" class="tab">
    <div class="card">
      <div class="form-row">
        <label>Fecha</label>
        <input type="date" id="extraDate">
      </div>

      <div class="form-row">
        <label>Horas trabajadas</label>
        <input type="number" step="0.25" id="extraHours">
      </div>

      <div class="form-row">
        <label>Observaciones</label>
        <textarea id="extraNote"></textarea>
      </div>

      <button class="full" onclick="saveExtra()">Guardar horas</button>
    </div>

    <div class="card">
      <h3>Horas extra</h3>
      <div id="extraList"></div>
    </div>
  </section>

  <section id="ajustes" class="tab">
    <div class="card">
      <h3>Colores de categorías</h3>
      <div id="colorSettings"></div>
      <button class="full" onclick="saveColors()">Guardar colores</button>
    </div>

    <div class="card">
      <h3>Datos</h3>
      <button class="danger full" onclick="resetApp()">Borrar todos los datos</button>
    </div>
  </section>

</main>

<nav class="bottom-nav">
  <button class="nav-btn active" onclick="showTab('resumen', this)"><span>🏠</span>Inicio</button>
  <button class="nav-btn" onclick="showTab('calendario', this)"><span>📅</span>Calend.</button>
  <button class="nav-btn" onclick="showTab('contadores', this)"><span>📊</span>Cont.</button>
  <button class="nav-btn" onclick="showTab('historico', this)"><span>🗂️</span>Hist.</button>
  <button class="nav-btn" onclick="showTab('horas', this)"><span>⏱️</span>Horas</button>
  <button class="nav-btn" onclick="showTab('ajustes', this)"><span>⚙️</span>Ajustes</button>
</nav>

<script src="app.js"></script>

<script>
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./service-worker.js");
  }
</script>

</body>
</html>
